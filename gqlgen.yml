# gqlgen configuration — https://gqlgen.com/config/
schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

autobind: []

models:
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  KubeContext:
    fields:
      namespaces:
        resolver: true
      namespace:
        resolver: true
      deployments:
        resolver: true
      deployment:
        resolver: true
      cronJobs:
        resolver: true
      cronJob:
        resolver: true
      pods:
        resolver: true
      pod:
        resolver: true
      apiResources:
        resolver: true
      customResources:
        resolver: true
  Namespace:
    fields:
      deployments:
        resolver: true
      cronJobs:
        resolver: true
      pods:
        resolver: true
      customResources:
        resolver: true
      apiResources:
        resolver: true
  CustomResource:
    fields:
      yaml:
        resolver: true
  Deployment:
    fields:
      pods:
        resolver: true
      yaml:
        resolver: true
      restarts:
        resolver: true
      configMaps:
        resolver: true
      secrets:
        resolver: true
  CronJob:
    fields:
      jobs:
        resolver: true
      yaml:
        resolver: true
      pods:
        resolver: true
      configMaps:
        resolver: true
      secrets:
        resolver: true
  Job:
    fields:
      yaml:
        resolver: true
      pods:
        resolver: true
  ConfigMap:
    fields:
      yaml:
        resolver: true
  Secret:
    fields:
      yaml:
        resolver: true
  Pod:
    fields:
      yaml:
        resolver: true
