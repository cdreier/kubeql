# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kubeql

before:
  hooks:
    - npm ci --prefix web
    - npm run build --prefix web

builds:
  - id: kubeql
    main: ./cmd/kubeql
    binary: kubeql
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  name_template: "v{{.Version}}"
  prerelease: auto
